name: macOS Build
on:
  push:
    branches: [main]
    paths: ['Sources/**', 'Resources/**', 'Project/project.yml', 'scripts/build-macos.sh', 'scripts/verify-keychain-helper.py', 'tests/**', '.github/workflows/build.yml']
  pull_request:
    paths: ['Sources/**', 'Resources/**', 'Project/project.yml', 'scripts/build-macos.sh', 'scripts/verify-keychain-helper.py', 'tests/**', '.github/workflows/build.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    name: Build public macOS source
    runs-on: xcode-27
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - name: Show toolchain
        run: xcodebuild -version
      - name: Finance calculation smoke tests
        run: |
          swiftc -parse-as-library \
            Sources/Shared/Finance/FinancialPrecision.swift \
            Sources/Shared/Finance/DepositSettlementRule.swift \
            tests/FinanceSmoke.swift \
            -o "$RUNNER_TEMP/fintrack-finance-smoke"
          "$RUNNER_TEMP/fintrack-finance-smoke"
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Build Universal Release
        run: ./scripts/build-macos.sh Release
      - name: Verify app identity
        run: |
          app=.build/app/Build/Products/Release/FinTrack.app
          fintrack_version="$(awk '/MARKETING_VERSION:/ {gsub(/"/,"",$2); print $2; exit}' Project/project.yml)"
          fintrack_build="$(awk '/CURRENT_PROJECT_VERSION:/ {gsub(/"/,"",$2); print $2; exit}' Project/project.yml)"
          test "$(/usr/libexec/PlistBuddy -c 'Print CFBundleIdentifier' "$app/Contents/Info.plist")" = dev.agumuzi.fintrack.macos
          test "$(/usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' "$app/Contents/Info.plist")" = "$fintrack_version"
          test "$(/usr/libexec/PlistBuddy -c 'Print CFBundleVersion' "$app/Contents/Info.plist")" = "$fintrack_build"
          codesign --verify --deep --strict "$app"
          fintrack_archs="$(lipo -archs "$app/Contents/MacOS/FinTrack")"
          [[ " $fintrack_archs " == *" arm64 "* ]]
          [[ " $fintrack_archs " == *" x86_64 "* ]]
          test -f "$app/Contents/Resources/Assets.car"
          python3 scripts/verify-keychain-helper.py
          cmp Resources/FinTrackKeychainHelper "$app/Contents/Resources/FinTrackKeychainHelper"
          test -x "$app/Contents/Resources/FinTrackKeychainHelper"
          test -f "$app/Contents/Resources/zh-Hans.lproj/Localizable.strings"
          cmp LICENSE "$app/Contents/Resources/LICENSE.txt"
          test -f "$app/Contents/Resources/ThirdPartyNotices.txt"
